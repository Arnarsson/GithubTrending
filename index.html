<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevPulse — High Signal Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#0A0A0A',
            card: '#161616',
            border: '#262626',
            accent: '#8B5CF6',
            success: '#22C55E',
            freshness: '#F59E0B',
            authority: '#60A5FA'
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'ui-sans-serif', 'system-ui']
          },
          boxShadow: {
            soft: '0 10px 30px rgba(0,0,0,0.35)',
            glow: '0 0 0 1px rgba(255,255,255,0.03), 0 0 30px rgba(139,92,246,0.15)'
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          },
          animation: {
            fadeUp: 'fadeUp 0.6s ease forwards'
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .bg-texture {
      background-image: radial-gradient(1200px 600px at 20% -10%, rgba(88, 28, 135, 0.25), transparent 60%),
                        radial-gradient(900px 500px at 90% 10%, rgba(14, 116, 144, 0.18), transparent 55%),
                        linear-gradient(to bottom, #0A0A0A, #0A0A0A);
    }
    .noise {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.035"/></svg>');
    }
    .chip-active {
      background-color: #161616;
      border-color: #3f3f46;
      color: #ffffff;
    }
    .focus-ring:focus-visible {
      outline: 2px solid rgba(96, 165, 250, 0.8);
      outline-offset: 2px;
    }
    .density-compact .card-body {
      padding-top: 14px;
      padding-bottom: 14px;
    }
    .density-compact .card-description {
      display: none;
    }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
  </style>
</head>
<body class="bg-background text-gray-300 font-sans pb-20 sm:pb-0">
  <div class="min-h-screen bg-texture">
    <div class="noise min-h-screen">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

            </div>
            <div class="h-6 w-px bg-border hidden sm:block"></div>

              <span class="text-xs text-gray-500 font-mono">Presets</span>

              <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white focus-ring" data-preset="indie-devs">Indie Devs</button>

          <nav class="hidden sm:flex flex-wrap items-center gap-2">

              <span class="text-xs text-gray-500 font-mono">Ecosystem</span>
              <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white chip-active focus-ring" data-ecosystem="All">All</button>
              <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white focus-ring" data-ecosystem="Frontend">Frontend</button>

              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs text-gray-500 font-mono">Timeframe</span>
                <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white chip-active focus-ring" data-timeframe="week">This Week</button>
                <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white focus-ring" data-timeframe="today">Today</button>

              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs text-gray-500 font-mono">Ecosystem</span>
                <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white chip-active focus-ring" data-ecosystem="All">All</button>
                <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white focus-ring" data-ecosystem="Frontend">Frontend</button>

                <button class="px-3 py-1.5 rounded-full border border-border text-sm text-gray-400 hover:text-white focus-ring" id="saved-only-mobile">Saved</button>
              </div>

        <main class="mt-8 grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-6">

  <template id="card-template">
    <article class="relative w-full bg-card border border-border rounded-xl p-5 flex flex-col md:flex-row md:items-center gap-5 md:gap-6 shadow-soft hover:shadow-glow hover:border-gray-600 transition-all cursor-pointer group animate-fadeUp card-body">
      <div class="absolute left-0 top-4 bottom-4 w-1 rounded-full bg-gradient-to-b from-authority via-accent to-success opacity-70"></div>

      <div class="flex items-center gap-4 md:gap-5 flex-1 min-w-0 pl-2 w-full">
        <div class="font-mono text-2xl md:text-3xl font-bold text-gray-500 w-10 text-center" data-rank></div>

        <div class="flex flex-col gap-1 min-w-0">
          <div class="flex items-center gap-3 flex-wrap">
            <h3 class="text-xl font-semibold text-white truncate hover:text-accent transition-colors" data-title></h3>
            <span class="flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-mono" data-language-pill>
              <span class="w-1.5 h-1.5 rounded-full" data-language-dot></span>
              <span data-language></span>
            </span>
            <span class="px-2 py-0.5 rounded-full text-xs font-medium" data-freshness-pill></span>
          </div>
          <p class="text-sm text-gray-400 line-clamp-2 card-description" data-description></p>
          <div class="text-xs text-gray-400 sm:hidden" data-starred-by-mobile></div>
          <div class="flex items-center gap-2 text-xs text-gray-500 font-mono">
            <span data-ecosystem></span>
            <span>•</span>
            <span data-last-commit></span>
          </div>
        </div>
      </div>

      <div class="flex md:flex flex-col gap-2 md:gap-1.5 md:items-end md:border-r md:border-border md:pr-6 md:mr-2 min-w-[170px] w-full md:w-auto">
        <div class="flex items-center gap-2 rounded-full border border-border px-2 py-1 bg-black/20 w-fit">
          <div class="flex items-center -space-x-2" data-avatar-stack></div>
          <span class="text-xs text-gray-400 font-mono" data-curator-count></span>
        </div>
        <div class="text-xs text-gray-400 md:text-right" data-starred-by></div>
        <div class="text-[11px] text-success font-mono" data-velocity></div>

      <div class="flex flex-row md:flex-col items-center md:items-end justify-between md:justify-start gap-3 md:gap-2 min-w-[120px] relative w-full md:w-auto">

          <div class="text-3xl font-mono font-bold text-white tracking-tighter" data-trend></div>
          <div class="relative group/why">
            <button class="text-gray-500 hover:text-gray-200 focus-ring" aria-label="Why this score">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 18a6 6 0 100-12 6 6 0 000 12z"/></svg>
            </button>
            <div class="absolute right-0 mt-2 w-60 rounded-lg border border-border bg-card text-xs text-gray-300 p-3 shadow-soft opacity-0 translate-y-1 pointer-events-none group-hover/why:opacity-100 group-hover/why:translate-y-0 transition-all" data-tooltip></div>
          </div>
        </div>
        <div class="flex flex-col items-end md:items-end gap-2 md:gap-2">
          <div class="flex items-center gap-1 text-success text-xs font-mono font-medium" data-stars24></div>
          <svg class="hidden sm:block w-24 h-6 text-authority opacity-70" viewBox="0 0 100 20" preserveAspectRatio="none" data-spark></svg>
          <div class="flex items-center gap-3">
            <button class="text-xs font-mono text-gray-500 hover:text-white focus-ring" data-save>Save</button>
            <button class="text-xs font-mono text-gray-500 hover:text-white focus-ring" data-details>Details</button>
          </div>
        </div>

      <div class="hidden w-full mt-4 md:mt-3 border-t border-border pt-4 text-xs text-gray-400" data-details-panel>
        <div class="grid sm:grid-cols-2 gap-3">
          <div>
            <div class="font-mono text-gray-500 mb-1">Why this?</div>
            <div data-details-text></div>
          </div>
          <div>
            <div class="font-mono text-gray-500 mb-1">Curator context</div>
            <div class="flex flex-wrap gap-2" data-curator-tags></div>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script>
    let repoData = [];
    const fallbackData = [];

    const curatorProfiles = {
      bentossell: 'https://github.com/bentossell.png',
      steipete: 'https://github.com/steipete.png',
      shadcn: 'https://github.com/shadcn.png',
      torvalds: 'https://github.com/torvalds.png',
      danielgross: 'https://github.com/danielgross.png',
      swyx: 'https://github.com/swyx.png',
      theo: 'https://github.com/theo.png',
      bruce: 'https://github.com/bruce.png',
      t3dotgg: 'https://github.com/t3dotgg.png',
      matklad: 'https://github.com/matklad.png',
      dtolnay: 'https://github.com/dtolnay.png',
      rauchg: 'https://github.com/rauchg.png',
      geohot: 'https://github.com/geohot.png',
      karpathy: 'https://github.com/karpathy.png'
    };

    const state = {
      timeframe: 'week',
      ecosystem: 'All',
      newOnly: false,
      savedOnly: false,
      density: 'comfortable',
      isLoading: true,
      curators: new Set(),
      saved: new Set(JSON.parse(localStorage.getItem('devpulse:saved') || '[]'))
    };

    const feed = document.getElementById('feed');
    const emptyState = document.getElementById('empty-state');
    const curatorList = document.getElementById('curator-list');
    const curatorFilters = document.getElementById('curator-filters');
    const activeEcosystem = document.getElementById('active-ecosystem');
    const pageTitle = document.getElementById('page-title');
    const lastUpdated = document.getElementById('last-updated');

    function formatRelative(days) {
      if (days === 0) return 'today';
      if (days === 1) return 'yesterday';
      return `${days}d ago`;
    }

    function formatCommit(days) {
      if (days === 0) return 'Commit: today';
      if (days === 1) return 'Commit: yesterday';
      return `Commit: ${days}d ago`;
    }

    function withinTimeframe(repo) {
      if (state.timeframe === 'today') return repo.starredDaysAgo <= 0;
      if (state.timeframe === 'week') return repo.starredDaysAgo <= 7;
      return repo.starredDaysAgo <= 30;
    }

    function matchesFilters(repo) {
      if (!withinTimeframe(repo)) return false;
      if (state.ecosystem !== 'All' && repo.ecosystem !== state.ecosystem) return false;
      if (state.newOnly && repo.ageDays > 30) return false;
      if (state.savedOnly && !state.saved.has(repo.id)) return false;
      if (state.curators.size > 0) {
        const hasCurator = repo.curators.some(curator => state.curators.has(curator));
        if (!hasCurator) return false;
      }
      return true;
    }

    function buildSparkPath(points) {
      const max = Math.max(...points);
      const min = Math.min(...points);
      const range = max - min || 1;
      return points.map((value, index) => {
        const x = (index / (points.length - 1)) * 100;
        const y = 20 - ((value - min) / range) * 18;
        return `${index === 0 ? 'M' : 'L'}${x} ${y}`;
      }).join(' ');
    }

    function render() {
      if (!repoData.length) {
        emptyState.classList.remove('hidden');
        emptyState.textContent = 'No data loaded yet.';
        return;
      }
      const filtered = repoData
        .filter(matchesFilters)
        .sort((a, b) => b.trend - a.trend);

      feed.innerHTML = '';
      emptyState.classList.toggle('hidden', filtered.length !== 0 || state.isLoading);

      if (state.isLoading) {
        renderSkeletons();
        return;
      }

      filtered.forEach((repo, index) => {
        const template = document.getElementById('card-template');
        const card = template.content.cloneNode(true);
        const root = card.querySelector('article');
        root.style.animationDelay = `${index * 0.06}s`;

        card.querySelector('[data-rank]').textContent = `#${index + 1}`;
        card.querySelector('[data-title]').textContent = repo.title;
        card.querySelector('[data-description]').textContent = repo.description;
        card.querySelector('[data-ecosystem]').textContent = repo.ecosystem;
        card.querySelector('[data-last-commit]').textContent = formatCommit(repo.lastCommitDays);

        const freshnessPill = card.querySelector('[data-freshness-pill]');
        if (repo.ageDays <= 30) {
          freshnessPill.textContent = `New (${repo.ageDays}d)`;
          freshnessPill.className = 'px-2 py-0.5 rounded-full text-xs font-medium bg-freshness/10 border border-freshness/20 text-freshness';
        } else {
          freshnessPill.textContent = `Established (${repo.ageDays}d)`;
          freshnessPill.className = 'px-2 py-0.5 rounded-full text-xs font-medium bg-gray-500/10 border border-gray-500/20 text-gray-400';
        }

        const languagePill = card.querySelector('[data-language-pill]');
        const languageDot = card.querySelector('[data-language-dot]');
        languagePill.classList.add(`bg-${repo.languageColor}-500/10`, `border-${repo.languageColor}-500/20`, `text-${repo.languageColor}-400`);
        languageDot.classList.add(`bg-${repo.languageColor}-500`);
        card.querySelector('[data-language]').textContent = repo.language;

        const avatarStack = card.querySelector('[data-avatar-stack]');
        avatarStack.innerHTML = '';
        repo.curators.slice(0, 3).forEach(handle => {
          const img = document.createElement('img');
          img.src = curatorProfiles[handle];
          img.alt = handle;
          img.loading = 'lazy';
          img.className = 'w-7 h-7 rounded-full border-2 border-card';
          avatarStack.appendChild(img);
        });
        const extra = repo.curators.length - 3;
        if (extra > 0) {
          const extraBadge = document.createElement('div');
          extraBadge.className = 'w-7 h-7 rounded-full border-2 border-card bg-gray-800 flex items-center justify-center text-[10px] font-medium text-gray-400';
          extraBadge.textContent = `+${extra}`;
          avatarStack.appendChild(extraBadge);
        }

        card.querySelector('[data-curator-count]').textContent = `${repo.curators.length} curators`;
        card.querySelector('[data-starred-by]').innerHTML = `Starred by <span class="text-accent font-medium">@${repo.primaryCurator}</span> ${formatRelative(repo.starredDaysAgo)}`;
        card.querySelector('[data-velocity]').textContent = `+${repo.stars24} stars / 24h`;
        card.querySelector('[data-trend]').textContent = repo.trend;
        card.querySelector('[data-stars24]').innerHTML = `
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
          ${repo.stars24} / 24h
        `;

        card.querySelector('[data-tooltip]').innerHTML = `
          <div class="font-mono text-gray-400 mb-1">Trend Score: ${repo.trend}</div>
          <div>Authority: ${repo.authority} (${repo.primaryCurator})</div>
          <div>Velocity: ${repo.stars24} stars / 24h</div>
          <div>Freshness: ${repo.ageDays} days old</div>
        `;

        const spark = card.querySelector('[data-spark]');
        spark.innerHTML = `<path d="${buildSparkPath(repo.spark)}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>`;

        const saveButton = card.querySelector('[data-save]');
        const saved = state.saved.has(repo.id);
        saveButton.textContent = saved ? 'Saved' : 'Save';
        saveButton.classList.toggle('text-authority', saved);
        saveButton.addEventListener('click', (event) => {
          event.stopPropagation();
          if (state.saved.has(repo.id)) {
            state.saved.delete(repo.id);
          } else {
            state.saved.add(repo.id);
          }
          localStorage.setItem('devpulse:saved', JSON.stringify([...state.saved]));
          render();
        });

        const detailsPanel = card.querySelector('[data-details-panel]');
        const detailsButton = card.querySelector('[data-details]');
        const detailsText = card.querySelector('[data-details-text]');
        const curatorTags = card.querySelector('[data-curator-tags]');

        detailsText.textContent = `Authority ${repo.authority}, velocity ${repo.stars24}/24h, freshness ${repo.ageDays} days.`;
        curatorTags.innerHTML = '';
        repo.curators.slice(0, 5).forEach(handle => {
          const chip = document.createElement('span');
          chip.className = 'px-2 py-0.5 rounded-full border border-border text-gray-400';
          chip.textContent = `@${handle}`;
          curatorTags.appendChild(chip);
        });

        detailsButton.addEventListener('click', (event) => {
          event.stopPropagation();
          detailsPanel.classList.toggle('hidden');
        });

        card.querySelector('[data-starred-by-mobile]').textContent = `Starred by @${repo.primaryCurator} ${formatRelative(repo.starredDaysAgo)}`;
        feed.appendChild(card);
      });

      updateCurators(filtered);
      updateViewTitle();
    }

    function updateViewTitle() {
      if (state.savedOnly) {
        pageTitle.textContent = 'Saved Repos';
      } else {
        pageTitle.textContent = 'Today’s Top Picks';
      }
    }

    async function loadFeed() {
      try {
        const response = await fetch('./data-feed.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Failed to load feed');
        const payload = await response.json();
        repoData = payload.repos || [];
        if (payload.updatedAt && lastUpdated) {
          const updatedDate = new Date(payload.updatedAt);
          lastUpdated.textContent = `Updated ${updatedDate.toLocaleString()}`;
        }
      } catch (error) {
        repoData = fallbackData;
        emptyState.classList.remove('hidden');
        emptyState.textContent = 'Failed to load feed. Check data-feed.json.';
      } finally {
        state.isLoading = false;
        render();
      }
    }

    function updateCurators(filteredRepos) {
      const curatorCounts = {};
      repoData.forEach(repo => {
        repo.curators.forEach(curator => {
          curatorCounts[curator] = curatorCounts[curator] || { count: 0, total: 0 };
          curatorCounts[curator].total += 1;
        });
      });

      filteredRepos.forEach(repo => {
        repo.curators.forEach(curator => {
          curatorCounts[curator].count += 1;
        });
      });

      const curators = Object.keys(curatorCounts)
        .map(handle => ({ handle, ...curatorCounts[handle] }))
        .sort((a, b) => b.count - a.count || b.total - a.total)
        .slice(0, 5);

      curatorList.innerHTML = '';
      curators.forEach(curator => {
        const button = document.createElement('button');
        button.className = 'w-full flex items-center justify-between px-3 py-2 rounded-lg border border-border hover:border-gray-600 transition-all hover:shadow-glow focus-ring';
        const selected = state.curators.has(curator.handle);
        if (selected) button.classList.add('border-authority');
        button.innerHTML = `
          <div class="flex items-center gap-3">
            <img class="w-8 h-8 rounded-full" src="${curatorProfiles[curator.handle]}" alt="${curator.handle}" loading="lazy" />
            <div class="text-left">
              <div class="text-sm text-white">@${curator.handle}</div>
              <div class="text-[11px] text-gray-500 font-mono">Found ${curator.count} trending</div>
            </div>
          </div>
          <span class="text-xs text-authority font-mono">${90 + curator.count}</span>
        `;
        button.addEventListener('click', () => toggleCurator(curator.handle));
        curatorList.appendChild(button);
      });

      curatorFilters.innerHTML = '';
      Object.keys(curatorCounts).slice(0, 8).forEach(handle => {
        const chip = document.createElement('button');
        chip.className = 'px-2.5 py-1 rounded-full border border-border text-xs text-gray-400 hover:text-white focus-ring';
        if (state.curators.has(handle)) chip.classList.add('chip-active');
        chip.textContent = `@${handle}`;
        chip.addEventListener('click', () => toggleCurator(handle));
        curatorFilters.appendChild(chip);
      });
    }

    function renderSkeletons() {
      const skeletonCount = 3;
      for (let i = 0; i < skeletonCount; i += 1) {
        const placeholder = document.createElement('div');
        placeholder.className = 'w-full bg-card border border-border rounded-xl p-5 animate-pulse';
        placeholder.innerHTML = `
          <div class="h-4 bg-gray-700/40 rounded w-1/3 mb-3"></div>
          <div class="h-3 bg-gray-700/30 rounded w-2/3 mb-2"></div>
          <div class="h-3 bg-gray-700/20 rounded w-1/2"></div>
        `;
        feed.appendChild(placeholder);
      }
    }

    function toggleCurator(handle) {
      if (state.curators.has(handle)) {
        state.curators.delete(handle);
      } else {
        state.curators.add(handle);
      }
      render();
    }

    document.querySelectorAll('[data-timeframe]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-timeframe]').forEach(btn => btn.classList.remove('chip-active'));
        button.classList.add('chip-active');
        state.timeframe = button.dataset.timeframe;
        render();
      });
    });

    document.querySelectorAll('[data-ecosystem]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-ecosystem]').forEach(btn => btn.classList.remove('chip-active'));
        button.classList.add('chip-active');
        state.ecosystem = button.dataset.ecosystem;
        activeEcosystem.textContent = state.ecosystem;
        render();
      });
    });

    document.querySelectorAll('[data-density]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-density]').forEach(btn => btn.classList.remove('chip-active'));
        button.classList.add('chip-active');
        state.density = button.dataset.density;
        document.body.classList.toggle('density-compact', state.density === 'compact');
      });
    });

    document.querySelectorAll('[data-preset]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-preset]').forEach(btn => btn.classList.remove('chip-active'));
        button.classList.add('chip-active');
        const preset = button.dataset.preset;
        if (preset === 'ai-labs') {
          state.ecosystem = 'AI/ML';
          state.timeframe = 'week';
          state.newOnly = true;
          state.curators = new Set(['karpathy', 'danielgross', 'swyx']);
        } else if (preset === 'rust-core') {
          state.ecosystem = 'Rust';
          state.timeframe = 'month';
          state.newOnly = false;
          state.curators = new Set(['matklad', 'dtolnay']);
        } else if (preset === 'indie-devs') {
          state.ecosystem = 'Frontend';
          state.timeframe = 'week';
          state.newOnly = true;
          state.curators = new Set(['shadcn', 'theo', 'bentossell']);
        }

        document.querySelectorAll('[data-ecosystem]').forEach(btn => {
          btn.classList.toggle('chip-active', btn.dataset.ecosystem === state.ecosystem);
        });
        document.querySelectorAll('[data-timeframe]').forEach(btn => {
          btn.classList.toggle('chip-active', btn.dataset.timeframe === state.timeframe);
        });
        document.getElementById('new-only').classList.toggle('chip-active', state.newOnly);
        document.getElementById('new-only-mobile').classList.toggle('chip-active', state.newOnly);
        activeEcosystem.textContent = state.ecosystem;
        render();
      });
    });

    document.getElementById('new-only').addEventListener('click', (event) => {
      state.newOnly = !state.newOnly;
      event.currentTarget.classList.toggle('chip-active', state.newOnly);
      const mobileToggle = document.getElementById('new-only-mobile');
      if (mobileToggle) mobileToggle.classList.toggle('chip-active', state.newOnly);
      render();
    });

    document.getElementById('saved-only').addEventListener('click', (event) => {
      state.savedOnly = !state.savedOnly;
      event.currentTarget.classList.toggle('chip-active', state.savedOnly);
      const mobileToggle = document.getElementById('saved-only-mobile');
      if (mobileToggle) mobileToggle.classList.toggle('chip-active', state.savedOnly);
      render();
    });

    document.getElementById('new-only-mobile').addEventListener('click', (event) => {
      state.newOnly = !state.newOnly;
      event.currentTarget.classList.toggle('chip-active', state.newOnly);
      const desktopToggle = document.getElementById('new-only');
      if (desktopToggle) desktopToggle.classList.toggle('chip-active', state.newOnly);
      render();
    });

    document.getElementById('saved-only-mobile').addEventListener('click', (event) => {
      state.savedOnly = !state.savedOnly;
      event.currentTarget.classList.toggle('chip-active', state.savedOnly);
      const desktopToggle = document.getElementById('saved-only');
      if (desktopToggle) desktopToggle.classList.toggle('chip-active', state.savedOnly);
      render();
    });


    document.getElementById('mobile-filters-toggle').addEventListener('click', () => {
      document.getElementById('mobile-filters').classList.toggle('hidden');
    });

    const mobileNav = document.createElement('div');
    mobileNav.className = 'sm:hidden fixed bottom-0 left-0 right-0 bg-card/95 border-t border-border backdrop-blur px-4 py-3 flex items-center justify-between z-50';
    mobileNav.innerHTML = `
      <button class="flex flex-col items-center text-xs text-gray-400" id="mobile-feed">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        Feed
      </button>
      <button class="flex flex-col items-center text-xs text-gray-400" id="mobile-saved">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3-7 3V5z"/></svg>
        Saved
      </button>
      <button class="flex flex-col items-center text-xs text-gray-400" id="mobile-filters-btn">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h18M6 12h12M10 19h4"/></svg>
        Filters
      </button>
    `;
    document.body.appendChild(mobileNav);

    document.getElementById('mobile-feed').addEventListener('click', () => {
      state.savedOnly = false;
      document.getElementById('saved-only').classList.remove('chip-active');
      document.getElementById('saved-only-mobile').classList.remove('chip-active');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('mobile-saved').addEventListener('click', () => {
      state.savedOnly = !state.savedOnly;
      document.getElementById('saved-only').classList.toggle('chip-active', state.savedOnly);
      document.getElementById('saved-only-mobile').classList.toggle('chip-active', state.savedOnly);
      render();
    });

    document.getElementById('mobile-filters-btn').addEventListener('click', () => {
      document.getElementById('mobile-filters').classList.toggle('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('view-saved').addEventListener('click', () => {
      state.savedOnly = true;
      document.getElementById('view-saved').classList.add('chip-active');
      document.getElementById('view-feed').classList.remove('chip-active');
      document.getElementById('saved-only').classList.add('chip-active');
      document.getElementById('saved-only-mobile').classList.add('chip-active');
      render();
    });

    document.getElementById('view-feed').addEventListener('click', () => {
      state.savedOnly = false;
      document.getElementById('view-feed').classList.add('chip-active');
      document.getElementById('view-saved').classList.remove('chip-active');
      document.getElementById('saved-only').classList.remove('chip-active');
      document.getElementById('saved-only-mobile').classList.remove('chip-active');
      render();
    });

    document.body.classList.toggle('density-compact', state.density === 'compact');
    render();
    loadFeed();
  </script>
</body>
</html>
